name: Crypto Toolkit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install cryptography pyyaml
      - name: Generate keys & test
        run: |
          python3 crypto.py aes-gen
          python3 crypto.py aes-enc "Hello CI"
          python3 crypto.py rsa-gen
          python3 crypto.py rsa-enc "Hello CI"
      - name: Run tests
        run: python3 -m pytest tests/ -v
